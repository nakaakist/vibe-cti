version: '3.8'

services:
  # PostgreSQL データベース
  postgres:
    image: postgres:15-alpine
    container_name: vibe-postgres
    environment:
      - POSTGRES_DB=vibe_cti
      - POSTGRES_USER=vibe
      - POSTGRES_PASSWORD=vibe123
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - vibe-network

  # Redis キャッシュ/セッション管理
  redis:
    image: redis:7-alpine
    container_name: vibe-redis
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vibe-network

  # バックエンドAPI (Go)
  api:
    build: ./backend
    container_name: vibe-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=vibe_cti
      - DB_USER=vibe
      - DB_PASSWORD=vibe123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JANUS_URL=http://janus:8088/janus
      - FREESWITCH_HOST=freeswitch
      - FREESWITCH_ESL_PORT=8021
      - FREESWITCH_ESL_PASSWORD=ClueCon
    depends_on:
      - postgres
      - redis
    networks:
      - vibe-network

  # フロントエンド (React)
  frontend:
    build: ./frontend
    container_name: vibe-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_WS_URL=ws://localhost:8080/ws
      - REACT_APP_JANUS_URL=ws://localhost:8188
    depends_on:
      - api
    networks:
      - vibe-network

volumes:
  postgres-data:
  redis-data:

networks:
  vibe-network:
    driver: bridge